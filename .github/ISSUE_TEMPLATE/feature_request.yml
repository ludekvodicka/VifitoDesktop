name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: The app can set speed and incline and start or stop the belt. Proposals that would send a command without a deliberate user action, or that put Stop behind anything, will be declined; see the safety rules in the README.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy and platform impact
      description: Explain any change to what is stored on disk, what leaves the machine, or which platforms are supported.
